<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Dedunu Fashion House</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- Admin Login Modal (Username & Password) -->
    <div id="auth-modal" class="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full text-center">
            <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">🔐</div>
            <h2 class="text-2xl font-bold text-slate-900 mb-1">Admin Portal Login</h2>
            <p class="text-slate-500 text-sm mb-6">Enter your username and password to manage store.</p>
            
            <form onsubmit="handleLogin(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Username</label>
                    <input type="text" id="admin-username" required placeholder="Enter username (admin)" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-900 transition text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                    <input type="password" id="admin-password" required placeholder="Enter password" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-900 transition text-sm">
                </div>
                <button type="submit" class="w-full bg-slate-900 text-white font-medium py-3 rounded-xl hover:bg-slate-800 transition mt-2">Login to Dashboard</button>
            </form>
            <p id="auth-error" class="text-red-500 text-xs mt-3 hidden"></p>
        </div>
    </div>

    <!-- Admin Main Dashboard Content -->
    <div id="dashboard" class="hidden min-h-screen flex flex-col">
        <!-- Top Navbar -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <span class="bg-slate-900 text-white text-xs px-3 py-1 rounded-md font-bold uppercase">Admin Portal</span>
                    <h1 class="text-lg font-bold text-slate-900">Dedunu Fashion House</h1>
                </div>
                <div class="flex items-center gap-4">
                    <a href="index.html" target="_blank" class="text-xs text-slate-600 hover:text-slate-900 border px-3 py-1.5 rounded-lg">👁️ View Live Website</a>
                    <button onclick="logout()" class="text-xs text-red-600 hover:bg-red-50 border border-red-200 px-3 py-1.5 rounded-lg">Logout</button>
                </div>
            </div>
        </header>

        <!-- Main Body -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <!-- Left Column: Add / Edit Product Form -->
                <div class="lg:col-span-1 space-y-6">
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <div class="flex items-center justify-between mb-4">
                            <h2 id="form-title" class="text-lg font-bold text-slate-900">Add New Product</h2>
                            <button id="cancel-edit-btn" onclick="resetForm()" class="hidden text-xs text-red-600 underline font-semibold">Cancel Edit</button>
                        </div>
                        
                        <form onsubmit="handleProductSubmit(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Product Title *</label>
                                <input type="text" id="title" required placeholder="e.g. Silk Saree / Casual Shirt" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-slate-900 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Category *</label>
                                <select id="category" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-slate-900 outline-none">
                                    <!-- Dynamic categories -->
                                </select>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Price (LKR) *</label>
                                    <input type="number" id="price" required placeholder="5500" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-slate-900 outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Stock Status</label>
                                    <select id="stockStatus" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-slate-900 outline-none">
                                        <option value="In Stock">In Stock</option>
                                        <option value="Out of Stock">Out of Stock</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Multiple Images -->
                            <div class="space-y-2 border-t pt-3">
                                <label class="block text-xs font-semibold text-sky-700 uppercase">Product Image URLs (3-4 images)</label>
                                <input type="url" id="img1" placeholder="Image URL 1 (Main)" class="w-full px-3 py-1.5 border rounded-lg text-xs outline-none">
                                <input type="url" id="img2" placeholder="Image URL 2" class="w-full px-3 py-1.5 border rounded-lg text-xs outline-none">
                                <input type="url" id="img3" placeholder="Image URL 3" class="w-full px-3 py-1.5 border rounded-lg text-xs outline-none">
                                <input type="url" id="img4" placeholder="Image URL 4" class="w-full px-3 py-1.5 border rounded-lg text-xs outline-none">
                            </div>

                            <!-- Colors -->
                            <div class="border-t pt-3">
                                <label class="block text-xs font-semibold text-sky-700 uppercase mb-1">Available Colors (Comma separated)</label>
                                <input type="text" id="colors" placeholder="e.g. Red, Blue, Black, Gold" class="w-full px-3 py-2 border rounded-lg text-sm outline-none">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Description</label>
                                <textarea id="description" rows="3" placeholder="Brief description..." class="w-full px-3 py-2 border rounded-lg text-sm outline-none"></textarea>
                            </div>
                            
                            <button type="submit" id="submit-btn" class="w-full bg-slate-900 text-white font-medium py-2.5 rounded-lg hover:bg-slate-800 transition text-sm">Save Product</button>
                        </form>
                    </div>

                    <!-- Manage Categories -->
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                        <h2 class="text-lg font-bold text-slate-900 mb-4">Manage Categories</h2>
                        <form onsubmit="handleCategorySubmit(event)" class="flex gap-2 mb-4">
                            <input type="text" id="new-category-name" required placeholder="New category" class="flex-grow px-3 py-2 border rounded-lg text-sm outline-none">
                            <button type="submit" class="bg-slate-900 text-white font-medium px-4 py-2 rounded-lg text-sm">Add</button>
                        </form>
                        <div id="category-badge-list" class="flex flex-wrap gap-2"></div>
                    </div>
                </div>

                <!-- Right Column: Inventory Table with Search Bar -->
                <div class="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm h-fit">
                    <div class="flex items-center justify-between mb-4 flex-wrap gap-3">
                        <h2 class="text-lg font-bold text-slate-900">Current Inventory</h2>
                        <span id="product-count" class="bg-slate-100 text-slate-700 text-xs px-3 py-1 rounded-full font-semibold">0 Products</span>
                    </div>

                    <div class="mb-4">
                        <input type="text" id="admin-inventory-search" oninput="filterAdminTable()" placeholder="🔍 Search inventory by name, category, or color..." class="w-full px-4 py-2.5 border rounded-xl text-sm outline-none focus:ring-2 focus:ring-slate-900 bg-slate-50">
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm text-slate-600">
                            <thead class="bg-slate-50 text-xs uppercase text-slate-500 border-b">
                                <tr>
                                    <th class="py-3 px-4">Item</th>
                                    <th class="py-3 px-4">Category</th>
                                    <th class="py-3 px-4">Price / Stock</th>
                                    <th class="py-3 px-4 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="inventory-table-body" class="divide-y"></tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script>
        let activeAdminToken = "";
        let currentCategories = [];
        let allAdminProducts = [];
        let editingProductId = null;

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('admin-username').value.trim();
            const password = document.getElementById('admin-password').value.trim();
            const errorEl = document.getElementById('auth-error');

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const result = await response.json();

                if (result.success) {
                    activeAdminToken = result.token;
                    document.getElementById('auth-modal').classList.add('hidden');
                    document.getElementById('dashboard').classList.remove('hidden');
                    loadDashboardData();
                } else {
                    errorEl.textContent = result.message;
                    errorEl.classList.remove('hidden');
                }
            } catch (err) {
                errorEl.textContent = "Server connection failed!";
                errorEl.classList.remove('hidden');
            }
        }

        function logout() {
            activeAdminToken = "";
            document.getElementById('auth-modal').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('admin-username').value = '';
            document.getElementById('admin-password').value = '';
            document.getElementById('auth-error').classList.add('hidden');
            resetForm();
        }

        async function loadDashboardData() {
            try {
                const response = await fetch('/api/store-data');
                const result = await response.json();
                if (result.success) {
                    currentCategories = result.data.categories;
                    allAdminProducts = result.data.products;
                    renderCategoryDropdown(currentCategories);
                    renderCategoryList(currentCategories);
                    renderTable(allAdminProducts);
                }
            } catch (err) {
                alert("Failed to load data from server.");
            }
        }

        function renderCategoryDropdown(categories) {
            const select = document.getElementById('category');
            let html = '';
            categories.forEach(cat => {
                html += `<option value="${cat}">${cat}</option>`;
            });
            select.innerHTML = html;
        }

        function renderCategoryList(categories) {
            const container = document.getElementById('category-badge-list');
            let html = '';
            categories.forEach(cat => {
                html += `
                    <div class="flex items-center gap-2 bg-slate-100 text-slate-800 px-3 py-1.5 rounded-lg text-sm font-medium">
                        <span>${cat}</span>
                        <button onclick="deleteCategory('${cat}')" class="text-red-500 font-bold ml-1">×</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderTable(products) {
            const tbody = document.getElementById('inventory-table-body');
            document.getElementById('product-count').textContent = `${products.length} Products`;

            if (products.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-slate-400">No products found.</td></tr>`;
                return;
            }

            let html = '';
            products.forEach(p => {
                const img = p.images && p.images.length > 0 ? p.images[0] : 'https://via.placeholder.com/50';
                const stockBadge = p.stockStatus === 'Out of Stock' 
                    ? '<span class="text-red-600 bg-red-50 px-2 py-0.5 rounded text-[10px] font-bold">Out of Stock</span>' 
                    : '<span class="text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded text-[10px] font-bold">In Stock</span>';

                html += `
                    <tr class="hover:bg-slate-50">
                        <td class="py-3 px-4 flex items-center gap-3">
                            <img src="${img}" class="w-10 h-10 rounded-lg object-cover border">
                            <div>
                                <span class="font-medium text-slate-900 block">${p.title}</span>
                                <span class="text-xs text-sky-700">Colors: ${p.colors || 'None'}</span>
                            </div>
                        </td>
                        <td class="py-3 px-4"><span class="bg-slate-100 text-slate-700 text-xs px-2.5 py-1 rounded-md">${p.category}</span></td>
                        <td class="py-3 px-4">
                            <div class="font-bold text-slate-900">Rs. ${p.price.toLocaleString()}</div>
                            <div>${stockBadge}</div>
                        </td>
                        <td class="py-3 px-4 text-right space-x-1">
                            <button onclick="prepareEditProduct('${p.id}')" class="text-sky-600 hover:text-sky-800 text-xs font-semibold px-2 py-1 rounded hover:bg-sky-50">Edit</button>
                            <button onclick="deleteProduct('${p.id}')" class="text-red-600 hover:text-red-800 text-xs font-semibold px-2 py-1 rounded hover:bg-red-50">Delete</button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function filterAdminTable() {
            const query = document.getElementById('admin-inventory-search').value.toLowerCase().trim();
            const filtered = allAdminProducts.filter(p => 
                p.title.toLowerCase().includes(query) ||
                p.category.toLowerCase().includes(query) ||
                (p.colors && p.colors.toLowerCase().includes(query)) ||
                (p.description && p.description.toLowerCase().includes(query))
            );
            renderTable(filtered);
        }

        async function handleCategorySubmit(e) {
            e.preventDefault();
            const categoryName = document.getElementById('new-category-name').value.trim();
            if (!categoryName) return;

            try {
                const response = await fetch('/api/store-data', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-admin-token': activeAdminToken
                    },
                    body: JSON.stringify({ category: categoryName })
                });
                const result = await response.json();
                if (result.success) {
                    document.getElementById('new-category-name').value = '';
                    loadDashboardData();
                } else {
                    alert(result.message);
                }
            } catch (err) { alert("Failed to add category."); }
        }

        async function deleteCategory(categoryName) {
            if (!confirm(`Delete category "${categoryName}"?`)) return;
            try {
                const response = await fetch(`/api/categories/${encodeURIComponent(categoryName)}`, { 
                    method: 'DELETE',
                    headers: { 'x-admin-token': activeAdminToken }
                });
                const result = await response.json();
                if (result.success) loadDashboardData();
            } catch (err) { alert("Error deleting category."); }
        }

        function prepareEditProduct(id) {
            const product = allAdminProducts.find(p => p.id === id);
            if (!product) return;

            editingProductId = product.id;
            document.getElementById('form-title').textContent = "Edit Product";
            document.getElementById('submit-btn').textContent = "Update Product";
            document.getElementById('cancel-edit-btn').classList.remove('hidden');

            document.getElementById('title').value = product.title;
            document.getElementById('category').value = product.category;
            document.getElementById('price').value = product.price;
            document.getElementById('stockStatus').value = product.stockStatus || 'In Stock';
            document.getElementById('colors').value = product.colors || '';
            document.getElementById('description').value = product.description || '';

            const imgs = product.images || [];
            document.getElementById('img1').value = imgs[0] || '';
            document.getElementById('img2').value = imgs[1] || '';
            document.getElementById('img3').value = imgs[2] || '';
            document.getElementById('img4').value = imgs[3] || '';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            editingProductId = null;
            document.getElementById('form-title').textContent = "Add New Product";
            document.getElementById('submit-btn').textContent = "Save Product";
            document.getElementById('cancel-edit-btn').classList.add('hidden');
            document.querySelector('form').reset();
        }

        async function handleProductSubmit(e) {
            e.preventDefault();

            const images = [
                document.getElementById('img1').value.trim(),
                document.getElementById('img2').value.trim(),
                document.getElementById('img3').value.trim(),
                document.getElementById('img4').value.trim()
            ].filter(url => url !== '');

            const productData = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                price: document.getElementById('price').value,
                stockStatus: document.getElementById('stockStatus').value,
                colors: document.getElementById('colors').value,
                images: images,
                description: document.getElementById('description').value
            };

            try {
                let url = '/api/products';
                let method = 'POST';

                if (editingProductId) {
                    url = `/api/products/${editingProductId}`;
                    method = 'PUT';
                }

                const response = await fetch(url, {
                    method: method,
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-admin-token': activeAdminToken
                    },
                    body: JSON.stringify(productData)
                });

                const result = await response.json();
                if (result.success) {
                    alert(editingProductId ? "Product updated successfully!" : "Product saved successfully!");
                    resetForm();
                    loadDashboardData();
                } else {
                    alert("Error: " + result.message);
                }
            } catch (err) {
                alert("Failed to submit product.");
            }
        }

        async function deleteProduct(id) {
            if (!confirm("Are you sure you want to delete this product?")) return;
            try {
                const response = await fetch(`/api/products/${id}`, { 
                    method: 'DELETE',
                    headers: { 'x-admin-token': activeAdminToken }
                });
                const result = await response.json();
                if (result.success) loadDashboardData();
            } catch (err) { alert("Error deleting product."); }
        }
    </script>
</body>
</html>
